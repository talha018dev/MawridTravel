<header
  class="border-b border-[#e9e4ed] bg-[#fffaf7]/90 backdrop-blur-lg dark:border-(--mawrid-secondary) dark:bg-[#120d27]/90"
>
  <div
    class="mx-auto flex h-19.5 w-[min(73.75rem,calc(100%-2.5rem))] items-center gap-7 max-[620px]:h-17 max-[620px]:w-[calc(100%-1.5rem)]"
  >
    <div class="mr-auto"><app-logo /></div>
    <nav class="flex gap-2 max-[900px]:hidden" aria-label="Primary navigation">
      <a pButton text rounded class="text-(--mawrid-font-primary)! no-underline" routerLink="/">
        Home
      </a>
      <a pButton text rounded class="text-(--mawrid-font-primary)! no-underline" href="/tickets">
        Book tickets
      </a>
      <a pButton text rounded class="text-(--mawrid-font-primary)! no-underline" href="/journal">
        Journal
      </a>
      <a pButton text rounded class="text-(--mawrid-font-primary)! no-underline" href="/shop">
        Shop
      </a>
    </nav>
    <app-theme-toggle />
    <p-button
      class="min-[901px]:hidden"
      styleClass="text-(--mawrid-font-primary)!"
      [rounded]="true"
      [text]="true"
      [icon]="menuIcon"
      ariaLabel="Open navigation menu"
      (onClick)="mobileMenuOpen.set(true)"
    />
  </div>
</header>

<p-drawer
  header="Navigation"
  position="right"
  appendTo="body"
  ariaCloseLabel="Close navigation menu"
  [visible]="mobileMenuOpen()"
  (visibleChange)="mobileMenuOpen.set($event)"
>
  <nav class="flex flex-col gap-2" aria-label="Mobile navigation">
    <a
      pButton
      text
      class="justify-start text-(--mawrid-font-primary)! no-underline"
      routerLink="/"
      (click)="closeMobileMenu()"
    >
      Home
    </a>
    <a
      pButton
      text
      class="justify-start text-(--mawrid-font-primary)! no-underline"
      href="/tickets"
      (click)="closeMobileMenu()"
    >
      Book tickets
    </a>
    <a
      pButton
      text
      class="justify-start text-(--mawrid-font-primary)! no-underline"
      href="/journal"
      (click)="closeMobileMenu()"
    >
      Journal
    </a>
    <a
      pButton
      text
      class="justify-start text-(--mawrid-font-primary)! no-underline"
      href="/shop"
      (click)="closeMobileMenu()"
    >
      Shop
    </a>
  </nav>
</p-drawer>
