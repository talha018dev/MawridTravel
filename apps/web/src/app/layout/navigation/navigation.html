@if (drawer()) {
  <nav class="flex flex-col gap-1 px-3 py-4 pl-0" aria-label="Mobile navigation">

      class="rounded-[0.65rem] p-3.5 text-sm leading-tight font-extrabold tracking-[0.075em] text-(--mawrid-primary) uppercase no-underline hover:bg-[#f8e8e4] hover:text-[#b95745] focus-visible:bg-[#f8e8e4] focus-visible:text-[#b95745] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--mawrid-accent) dark:text-white dark:hover:bg-[#2b2147] dark:hover:text-[#f3a08e] dark:focus-visible:bg-[#2b2147] dark:focus-visible:text-[#f3a08e]"

      class="rounded-[0.65rem] p-3.5 text-sm leading-tight font-extrabold tracking-[0.075em] text-(--mawrid-primary) uppercase no-underline hover:bg-[#f8e8e4] hover:text-[#b95745] focus-visible:bg-[#f8e8e4] focus-visible:text-[#b95745] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--mawrid-accent) dark:text-white dark:hover:bg-[#2b2147] dark:hover:text-[#f3a08e] dark:focus-visible:bg-[#2b2147] dark:focus-visible:text-[#f3a08e]"

      >Shop</a

      class="mt-2 rounded-[0.65rem] bg-(--p-primary-color) p-3.5 text-center text-sm leading-tight font-extrabold tracking-[0.075em] text-(--p-primary-contrast-color) uppercase no-underline hover:bg-(--p-primary-hover-color) focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--p-primary-color)"

  <nav class="flex gap-2 max-[900px]:hidden" aria-label="Primary navigation">
    <a pButton text rounded class="text-(--mawrid-font-primary)! no-underline" routerLink="/">
      Home

    <a pButton text rounded class="text-(--mawrid-font-primary)! no-underline" href="/tickets">
      Book tickets
    </a>
    <a pButton text rounded class="text-(--mawrid-font-primary)! no-underline" href="/journal">
      Journal
    </a>
    <a pButton text rounded class="text-(--mawrid-font-primary)! no-underline" href="/shop">
      Shop
    </a>
    <a pButton rounded class="no-underline" routerLink="/login"> Login </a>
  </nav>
