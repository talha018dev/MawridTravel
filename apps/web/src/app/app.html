<div
  class="flex min-h-dvh min-w-70 flex-col overflow-x-hidden bg-[#fffaf7] font-['DM_Sans',system-ui,sans-serif] text-[#20183f] transition-colors duration-300 in-data-[theme=dark]:bg-[#120d27] in-data-[theme=dark]:text-[#fdf7f4]"
>
  <header
    class="relative z-10 border-b border-[#e9e4ed] bg-[#fffaf7]/90 backdrop-blur-lg in-data-[theme=dark]:border-[#40345f] in-data-[theme=dark]:bg-[#120d27]/90"
  >
    <div
      class="mx-auto flex h-19.5 w-[min(73.75rem,calc(100%-2.5rem))] items-center gap-7 max-[620px]:h-17 max-[620px]:w-[calc(100%-1.5rem)]"
    >
      <a
        class="mr-auto flex items-center gap-3 whitespace-nowrap font-['Playfair_Display',Georgia,serif] text-xl font-bold no-underline focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[#e8867347] max-[390px]:text-[0]"
        routerLink="/"
        aria-label="Mawrid Travel home"
      >
        <span
          class="grid size-10.75 shrink-0 place-items-center rounded-full bg-[#20183f] shadow-[0_0_0_2px_#f3b8a8] max-[620px]:size-9.75"
          aria-hidden="true"
        >
          <svg class="w-[70%] fill-[#f3b8a8]" viewBox="0 0 64 64">
            <path d="M19 42c15 5 29-3 27-18-3 7-9 9-12 17 0-10-5-14-4-23-9 8-13 16-11 24Z" />
          </svg>
        </span>
        <span class="max-[390px]:hidden">Mawrid Travel</span>
      </a>
      <nav class="flex gap-2 max-[900px]:hidden" aria-label="Primary navigation">
        <a
          class="rounded-full px-3 py-2.5 text-[.95rem] font-semibold no-underline hover:bg-[#f6f1f8] hover:text-[#e88673] in-data-[theme=dark]:hover:bg-[#271e46]"
          routerLink="/"
        >
          Home
        </a>
        <a
          class="rounded-full px-3 py-2.5 text-[.95rem] font-semibold no-underline hover:bg-[#f6f1f8] hover:text-[#e88673]"
          href="/tickets"
        >
          Book tickets
        </a>
        <a
          class="rounded-full px-3 py-2.5 text-[.95rem] font-semibold no-underline hover:bg-[#f6f1f8] hover:text-[#e88673]"
          href="/journal"
        >
          Journal
        </a>
        <a
          class="rounded-full px-3 py-2.5 text-[.95rem] font-semibold no-underline hover:bg-[#f6f1f8] hover:text-[#e88673]"
          href="/shop"
        >
          Shop
        </a>
      </nav>
      <p-button
        [rounded]="true"
        [text]="true"
        (onClick)="toggleTheme()"
        [ariaLabel]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        <span class="text-lg" aria-hidden="true">
          @if (theme() === 'dark') {
            &#9728;
          } @else {
            &#9790;
          }
        </span>
      </p-button>
    </div>
  </header>
  <main class="grid flex-1"><router-outlet /></main>
  <footer class="border-t border-[#e9e4ed] py-7 in-data-[theme=dark]:border-[#40345f]">
    <div
      class="mx-auto flex w-[min(73.75rem,calc(100%-2.5rem))] items-center justify-between gap-5 text-sm text-[#6d687c] in-data-[theme=dark]:text-[#b8b1c8] max-[620px]:w-[calc(100%-1.5rem)] max-[620px]:flex-col max-[620px]:items-start"
    >
      <p class="m-0">&copy; 2026 Mawrid Travel. Travel with care.</p>
      <nav class="flex gap-5 max-[620px]:flex-wrap" aria-label="Footer navigation">
        <a class="no-underline hover:text-[#e88673]" href="/tickets">Book</a>
        <a class="no-underline hover:text-[#e88673]" href="/journal">Journal</a>
        <a class="no-underline hover:text-[#e88673]" href="/shop">Shop</a>
        <a class="no-underline hover:text-[#e88673]" routerLink="/login">Account</a>
      </nav>
    </div>
  </footer>
</div>
