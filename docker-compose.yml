services:
  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB:-mawrid_travel};Username=${POSTGRES_USER:-mawrid};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      AdminSeed__Enabled: ${ADMIN_SEED_ENABLED:-false}
      AdminSeed__Email: ${ADMIN_SEED_EMAIL:-}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD:-}
      AdminSeed__FirstName: ${ADMIN_SEED_FIRST_NAME:-Mawrid}
      AdminSeed__LastName: ${ADMIN_SEED_LAST_NAME:-Admin}
    ports:
      - "127.0.0.1:5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
    - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mawrid_travel}
      POSTGRES_USER: ${POSTGRES_USER:-mawrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
